stages:
  - deploy

.deploy_script: &deploy_script
  - 'export NEXT_PUBLIC_BASE_PATH=${NEXT_PUBLIC_BASE_PATH:-/dashboard-eoc}'
  - 'export NEXT_PUBLIC_SIPKK_BACKEND_BASE_URL=${NEXT_PUBLIC_SIPKK_BACKEND_BASE_URL:-http://sipkk-baru.test}'
  - 'export NEXT_PUBLIC_MEDIA_MONITORING_URL=${NEXT_PUBLIC_MEDIA_MONITORING_URL:-https://pusatkrisis.kemkes.go.id/dashboard-media}'
  - 'export NEXT_PUBLIC_NLP_URL=${NEXT_PUBLIC_NLP_URL:-https://pusatkrisis.kemkes.go.id/nlp/}'
  - 'export SIPKK_BACKEND_BASE_URL=${SIPKK_BACKEND_BASE_URL:-http://sipkk-baru.test}'
  - 'export SIPKK_DASHBOARD_TTOKEN=${SIPKK_DASHBOARD_TTOKEN}'
  - 'export API_INDONESIA_KEY=${API_INDONESIA_KEY}'
  - 'export GEMINI_API_KEY=${GEMINI_API_KEY}'
  - 'export GOOGLE_AI_API_KEY=${GOOGLE_AI_API_KEY}'
  - docker compose -f docker-compose.yml up -d --build
  - docker image prune -f

deploy-staging:
  stage: deploy
  tags:
    - deploy
  only:
    - main
  variables:
    GIT_STRATEGY: fetch
    GIT_CLEAN_FLAGS: -ffdx
    GIT_DEPTH: 0
  script:
    - *deploy_script
