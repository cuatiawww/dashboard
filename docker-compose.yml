services:
  dashboard-eoc-ai:
    container_name: dashboard-eoc-ai
    image: dashboard-eoc-ai:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/dashboard-eoc}
        NEXT_PUBLIC_SIPKK_BACKEND_BASE_URL: ${NEXT_PUBLIC_SIPKK_BACKEND_BASE_URL:-http://sipkk-baru.test}
        NEXT_PUBLIC_MEDIA_MONITORING_URL: ${NEXT_PUBLIC_MEDIA_MONITORING_URL:-https://pusatkrisis.kemkes.go.id/dashboard-media}
        NEXT_PUBLIC_NLP_URL: ${NEXT_PUBLIC_NLP_URL:-https://pusatkrisis.kemkes.go.id/nlp/}
        SIPKK_BACKEND_BASE_URL: ${SIPKK_BACKEND_BASE_URL:-http://sipkk-baru.test}
        SIPKK_DASHBOARD_TTOKEN: ${SIPKK_DASHBOARD_TTOKEN:?SIPKK_DASHBOARD_TTOKEN is required}
        API_INDONESIA_KEY: ${API_INDONESIA_KEY:?API_INDONESIA_KEY is required}
        GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY is required}
        GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:?GOOGLE_AI_API_KEY is required}
        POSTGRES_HOST: ${POSTGRES_HOST:-db-postgres}
        POSTGRES_PORT: ${POSTGRES_PORT:-5432}
        POSTGRES_DB: ${POSTGRES_DB:-collector_bencana_ntt}
        POSTGRES_USER: ${POSTGRES_USER:-postgres}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
        POSTGRES_CONNECT_TIMEOUT_SECONDS: ${POSTGRES_CONNECT_TIMEOUT_SECONDS:-10}
        NTT_DATA_DIR: ${NTT_DATA_DIR:-/home/pusatkrisis/docker/data-ntt}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/dashboard-eoc}
      NEXT_PUBLIC_SIPKK_BACKEND_BASE_URL: ${NEXT_PUBLIC_SIPKK_BACKEND_BASE_URL:-http://sipkk-baru.test}
      NEXT_PUBLIC_MEDIA_MONITORING_URL: ${NEXT_PUBLIC_MEDIA_MONITORING_URL:-https://pusatkrisis.kemkes.go.id/dashboard-media}
      NEXT_PUBLIC_NLP_URL: ${NEXT_PUBLIC_NLP_URL:-https://pusatkrisis.kemkes.go.id/nlp/}
      SIPKK_DASHBOARD_TTOKEN: ${SIPKK_DASHBOARD_TTOKEN:?SIPKK_DASHBOARD_TTOKEN is required}
      SIPKK_BACKEND_BASE_URL: ${SIPKK_BACKEND_BASE_URL:-http://sipkk-baru.test}
      API_INDONESIA_KEY: ${API_INDONESIA_KEY:?API_INDONESIA_KEY is required}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY is required}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:?GOOGLE_AI_API_KEY is required}
      POSTGRES_HOST: ${POSTGRES_HOST:-db-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-collector_bencana_ntt}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_CONNECT_TIMEOUT_SECONDS: ${POSTGRES_CONNECT_TIMEOUT_SECONDS:-10}
      NTT_DATA_DIR: ${NTT_DATA_DIR:-/home/pusatkrisis/docker/data-ntt}
    # expose:
    #   - "3000"
    ports:
      - "3004:3000"  
    volumes:
      - dashboard-eoc-ai-node-modules-v2:/app/node_modules
      # API membaca folder host pada path absolut yang sama, read-only.
      - ${NTT_DATA_DIR:-/home/pusatkrisis/docker/data-ntt}:${NTT_DATA_DIR:-/home/pusatkrisis/docker/data-ntt}:ro
      # Tetap expose CSV sebagai asset public bila dibutuhkan frontend.
      - ${NTT_DATA_DIR:-/home/pusatkrisis/docker/data-ntt}:/app/public/data/ntt:ro
    # networks:
    #   - proxy
    restart: unless-stopped
    networks: 
      - collector

networks:
  collector:
    external: true
  db_db:
    external: true  
# networks:
#   proxy:
#     name: ${PROXY_NETWORK:-proxynet}
#     external: true

volumes:
  dashboard-eoc-ai-node-modules-v2:
